<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin & Model Consultant</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            height: 80vh;
            border: 1px solid #333;
        }

        .chat-header {
            padding: 20px;
            background-color: #252525;
            border-bottom: 1px solid #333;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.4rem;
            color: #55ff55;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-line;
        }

        .bot-message {
            background-color: #2a2a2a;
            color: #e0e0e0;
            align-self: flex-start;
            border-left: 4px solid #55ff55;
        }

        .user-message {
            background-color: #005f73;
            color: #ffffff;
            align-self: flex-end;
            border-right: 4px solid #0a9396;
        }

        .chat-input-area {
            padding: 15px;
            background-color: #252525;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #121212;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            border-color: #55ff55;
        }

        button {
            padding: 12px 24px;
            background-color: #55ff55;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #40cc40;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>🎮 Minecraft Skin & Model Consultant</h1>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">สวัสดีครับ! ยินดีต้อนรับสู่ร้านบริการรับทำ Skin, Blockbench 3D Model และ Lua Script สอบถามประเมินราคา คิวงาน หรือวิธีลงไฟล์ในเกมได้เลยครับ!</div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="พิมพ์คำถามของคุณที่นี่..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">ส่ง</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatBox = document.getElementById('chatBox');
        const userText = inputField.value.trim();

        if (!userText) return;

        // แสดงข้อความฝั่งผู้ใช้
        appendMessage(userText, 'user-message');
        inputField.value = '';
        inputField.disabled = true;
        sendBtn.disabled = true;

        // ข้อความระหว่างรอ AI ตอบ
        const loadingDiv = appendMessage('กำลังประมวลผล...', 'bot-message');

        try {
            // ยิงเข้า Serverless Function /api/chat ฝั่ง Backend
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: userText })
            });

            const data = await response.json();
            
            if (data.reply) {
                loadingDiv.innerText = data.reply;
            } else {
                loadingDiv.innerText = '⚠️ ไม่สามารถดึงคำตอบได้ กรุณาลองใหม่อีกครั้ง';
            }
        } catch (error) {
            loadingDiv.innerText = '❌ เชื่อมต่อกับเซิร์ฟเวอร์ไม่สำเร็จ: ' + error.message;
        } finally {
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById('chatBox');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return messageDiv;
    }
</script>

</body>
</html>
